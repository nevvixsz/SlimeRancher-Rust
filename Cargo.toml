[workspace]
resolver = "2"
members = [
    "crates/sr_math",
    "crates/sr_ids",
    "crates/sr_data",
    "crates/sr_model",
    "crates/sr_physics",
    "crates/sr_gameplay",
    "crates/sr_ai",
    "crates/sr_world",
    "crates/sr_sim",
    "crates/sr_persist",
    "crates/sr_sandbox",
    "crates/sr_tools",
    "crates/sr_client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

# Compile Bevy, wgpu, audio/image decoders, and math crates with optimizations even in `cargo run`
# while keeping `sr_*` workspace crates fast to recompile incrementally.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
