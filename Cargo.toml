[workspace]
resolver = "2"
members = [
    "crates/sr_math",
    "crates/sr_ids",
    "crates/sr_data",
    "crates/sr_model",
    "crates/sr_sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
